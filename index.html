/* ===== WINE GARDEN — стили ===== */
:root {
  --green-900: #07150f;
  --green-800: #0b1f17;
  --green-700: #123222;
  --green-600: #1a4630;
  --gold: #c9a54b;
  --gold-light: #e6cf8f;
  --white: #f7f4ec;
  --muted: #a9b5ac;
  --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: radial-gradient(circle at top, var(--green-700), var(--green-900) 60%) fixed;
  color: var(--white);
  line-height: 1.5;
  min-height: 100vh;
}

/* ----- Шапка ----- */
.hero { text-align: center; padding: 48px 20px 24px; animation: fade .8s ease both; }
.logo {
  font-family: var(--serif);
  font-size: clamp(34px, 8vw, 56px);
  font-weight: 700;
  letter-spacing: .22em;
  color: var(--gold);
  text-shadow: 0 2px 20px rgba(201,165,75,.25);
}
.logo.small { font-size: 22px; }
.tagline { font-size: 13px; letter-spacing: .25em; text-transform: uppercase; color: var(--gold-light); margin-top: 6px; }
.divider { width: 70px; height: 1px; background: var(--gold); margin: 22px auto; position: relative; }
.divider::after { content: ""; position: absolute; left: 50%; top: -3px; width: 7px; height: 7px; background: var(--gold); transform: translateX(-50%) rotate(45deg); }
h1 { font-family: var(--serif); font-size: clamp(30px, 6vw, 44px); font-weight: 600; }
.subtitle { color: var(--muted); margin-top: 4px; }

.search-box { position: relative; max-width: 460px; margin: 24px auto 0; }
#search {
  width: 100%; padding: 14px 44px 14px 18px; font: inherit; font-size: 16px;
  color: var(--white); background: rgba(255,255,255,.06);
  border: 1px solid rgba(201,165,75,.4); border-radius: 30px; outline: none;
  transition: border-color .25s, box-shadow .25s;
}
#search::placeholder { color: var(--muted); }
#search:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,165,75,.18); }
#clear { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--gold); font-size: 26px; cursor: pointer; line-height: 1; }

/* ----- Категории ----- */
.cats-wrap {
  position: sticky; top: 0; z-index: 20;
  background: rgba(7,21,15,.92); backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(201,165,75,.2);
}
.cats {
  display: flex; gap: 10px; overflow-x: auto; padding: 12px 16px;
  max-width: 1100px; margin: 0 auto; scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.cats::-webkit-scrollbar { display: none; }
.chip {

  color: var(--white); background: transparent; border: 1px solid rgba(201,165,75,.45);

.chip:hover { border-color: var(--gold); color: var(--gold-light); }
.chip.active { background: var(--gold); color: var(--green-900); border-color: var(--gold); font-weight: 600; }

/* ----- Меню ----- */
.menu { max-width: 1100px; margin: 0 auto; padding: 8px 16px 40px; }
.section { padding-top: 34px; animation: fade .5s ease both; }

.card {

.img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s; }

.price.unknown { font-size: 18px; font-style: italic; font-weight: 500; color: var(--muted); }

.empty { text-align: center; padding: 70px 20px; font-family: var(--serif); font-size: 28px; color: var(--gold-light); }

.footer { text-align: center; padding: 30px 20px 40px; color: var(--muted); font-size: 13px; border-top: 1px solid rgba(201,165,75,.2); }

@keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.btn { display: inline-block; padding: 12px 24px; border-radius: 30px; background: var(--gold); color: var(--green-900); font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid var(--gold); transition: transform .25s, background .25s; }

.brand { --logo: #e6c28b; color: var(--logo); font-family: var(--serif); }

  {

// ===== Форматирование цены =====
const priceFormatter = new Intl.NumberFormat("ru-RU");
function formatPrice(price) {
  if (typeof price !== "number" || !isFinite(price) || price <= 0) return null;
  return priceFormatter.format(price) + " сум";
}

// ===== Вспомогательные функции =====
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function norm(s) { return String(s || "").toLowerCase().replace(/ё/g, "е").trim(); }

const state = { cat: "all", query: "" };
const $menu = document.getElementById("menu");
const $cats = document.getElementById("cats");
const $search = document.getElementById("search");
const $clear = document.getElementById("clear");

// ===== Значок и цвет заставки для каждого блюда =====
const ICONS = [
  [/пельмен/, "🥟"], [/борщ|шурпа|уха|суп|хашлама/, "🍲"], [/хумус/, "🫘"], [/оливк|маслин/, "🫒"],
  [/брускетт/, "🥖"], [/паштет/, "🥖"], [/сыр|брынз|рикотт/, "🧀"], [/мидии/, "🦪"], [/креветк/, "🦐"],
  [/скумбри|сельд|рыб|дорадо|сибас|форел|лосос|семг/, "🐟"], [/шампиньон|гриб/, "🍄"], [/баклажан/, "🍆"],
  [/перепел|курин|куриц|цезарь с курицей|крыл/, "🍗"], [/шашлык|люля/, "🍢"], [/баран|ягн|каре|корейка/, "🍖"],
  [/стейк|рибай|ти-бон|медальон|вырезк|говяд|говяж|веллингтон|бефстроганов|бычий|язык|язычк/, "🥩"],
  [/трубочк|мулен|рулетик/, "🌯"], [/овощ|хоровац|соленья|брокколи/, "🥦"], [/салат|цезарь|каприз|оливье/, "🥗"]
];
function dishIcon(item, fallback) {
  const n = norm(item.name);
  for (let i = 0; i < ICONS.length; i++) if (ICONS[i][0].test(n)) return ICONS[i][1];
  return fallback;
}
function dishHue(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return 135 + (h % 40);   // оттенки зелёного
}

// ===== Карточка блюда =====
function buildCard(item, icon) {
  const card = el("article", "card");
  const imgBox = el("div", "img");

  const ph = el("div", "placeholder");
  ph.style.background = "radial-gradient(circle at 30% 20%, hsl(" + dishHue(item.name) + ",42%,22%), #0b1f17 75%)";
  ph.appendChild(el("span", "ico", dishIcon(item, icon)));
  ph.appendChild(el("span", "wg", "WG"));
  imgBox.appendChild(ph);

  if (item.image) {
    const img = document.createElement("img");
    img.src = IMAGE_DIR + item.image;
    img.alt = item.name;
    img.loading = "lazy";
    img.onerror = function () { img.remove(); };   // нет файла — остаётся placeholder
    imgBox.appendChild(img);
  }
  card.appendChild(imgBox);

  const body = el("div", "body");
  body.appendChild(el("h3", "", item.name));
  if (item.description) body.appendChild(el("p", "", item.description));

  const formatted = formatPrice(item.price);
  const price = el("div", formatted ? "price" : "price unknown");
  price.textContent = formatted ? formatted.replace(" сум", "") : "Цена уточняется";
  if (formatted) price.appendChild(el("small", "", "сум"));
  body.appendChild(price);

  card.appendChild(body);
  return card;
}

// ===== Отрисовка меню =====
function render() {
  const q = norm(state.query);
  $menu.textContent = "";
  let found = 0;

  MENU.forEach(function (cat) {
    if (state.cat !== "all" && state.cat !== cat.id) return;
    const items = cat.items.filter(function (it) { return !q || norm(it.name).includes(q); });
    if (!items.length) return;

    const section = el("section", "section");
    section.id = "cat-" + cat.id;
    section.appendChild(el("h2", "", cat.title));
    const grid = el("div", "grid");
    items.forEach(function (it) { grid.appendChild(buildCard(it, cat.icon)); });
    section.appendChild(grid);
    $menu.appendChild(section);
    found += items.length;
  });

  if (!found) $menu.appendChild(el("div", "empty", "Блюда не найдены"));
}

// ===== Кнопки категорий =====
function buildCategories() {
  const list = [{ id: "all", title: "Всё меню" }].concat(MENU);
  list.forEach(function (cat) {
    const btn = el("button", "chip" + (cat.id === state.cat ? " active" : ""), cat.title);
    btn.type = "button";
    btn.dataset.id = cat.id;
    btn.addEventListener("click", function () {
      state.cat = cat.id;
      $cats.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("active", c === btn); });
      btn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    $cats.appendChild(btn);
  });
}

// ===== Поиск =====
$search.addEventListener("input", function () {
  state.query = $search.value;
  $clear.hidden = !$search.value;
  render();
});
$clear.addEventListener("click", function () {
  $search.value = "";
  state.query = "";
  $clear.hidden = true;
  render();
  $search.focus();
});

// ===== Запуск =====
buildCategories();
render();

</script>
</body>
</html>
